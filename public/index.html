<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат с файлами</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            height: 100vh; 
            background: #f4f4f9; 
            display: flex;
            flex-direction: column;
        }
        
        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #login-screen h1 { margin-bottom: 20px; color: #333; }
        #login-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 280px;
        }
        #login-form input, #login-form button {
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        #login-form button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        #login-form button:hover { background: #0056b3; }
        #login-error {
            color: #dc3545;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        #chat-screen { display: none; height: 100vh; }
        #chat-layout {
            display: flex;
            height: 100%;
        }
        
        #sidebar {
            width: 200px;
            background: #fff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }
        #sidebar-header {
            padding: 12px;
            background: #007bff;
            color: white;
            font-weight: bold;
        }
        #online-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .online-user {
            padding: 8px 12px;
            margin: 4px 0;
            background: #f8f9fa;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .online-user:hover { background: #e9ecef; }
        .online-user.selected {
            background: #007bff;
            color: white;
        }
        
        #chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        #chat-header {
            background: #007bff;
            color: white;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
        }
        #header-buttons {
            display: flex;
            gap: 8px;
        }
        .header-btn {
            background: transparent;
            color: white;
            border: 1px solid white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .header-btn:hover { background: rgba(255,255,255,0.2); }
        .header-btn.off {
            background: rgba(255,255,255,0.3);
            opacity: 0.6;
        }
        
        #messages { 
            list-style-type: none; 
            margin: 0; 
            padding: 15px; 
            flex: 1; 
            overflow-y: auto; 
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #messages li { 
            padding: 10px 14px; 
            border-radius: 15px; 
            max-width: 70%;
            word-wrap: break-word;
            background: #e9ecef;
            align-self: flex-start;
        }
        #messages li .name {
            font-weight: bold;
            font-size: 13px;
            color: #007bff;
            margin-bottom: 3px;
        }
        #messages li.mine {
            align-self: flex-end;
            background: #007bff;
            color: white;
        }
        #messages li.mine .name { color: #d0e4ff; }
        
        #messages li.system {
            align-self: center;
            background: transparent;
            color: #888;
            font-style: italic;
            font-size: 14px;
            padding: 5px 10px;
            max-width: 100%;
        }
        
        #messages li.private {
            background: #fff3cd;
            border: 2px solid #ffc107;
        }
        #messages li.private.mine {
            background: #ffe69c;
            border: 2px solid #ff9800;
        }
        #messages li.private .name { color: #856404; }
        
        /* Стили для файлов */
        .file-preview {
            margin-top: 8px;
        }
        .file-preview img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            cursor: pointer;
            display: block;
        }
        .file-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(255,255,255,0.3);
            border-radius: 8px;
            text-decoration: none;
            color: inherit;
            margin-top: 8px;
        }
        .file-link:hover {
            background: rgba(255,255,255,0.5);
        }
        .file-link .icon {
            font-size: 20px;
        }
        .file-link .info {
            display: flex;
            flex-direction: column;
        }
        .file-link .filename {
            font-weight: bold;
            font-size: 14px;
        }
        .file-link .filesize {
            font-size: 12px;
            opacity: 0.8;
        }
        
        /* Прогресс загрузки */
        #upload-progress {
            display: none;
            padding: 8px 12px;
            background: #fff3cd;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
            color: #856404;
        }

        #form { 
            display: flex; 
            padding: 10px; 
            background: #fff; 
            border-top: 1px solid #ddd;
            align-items: center;
        }
        #attach-btn {
            background: #6c757d;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            margin-right: 8px;
        }
        #attach-btn:hover { background: #5a6268; }
        #file-input { display: none; }
        #recipient-label {
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 20px;
            margin-right: 8px;
            font-size: 14px;
            color: #666;
        }
        #input { 
            flex: 1; 
            padding: 10px; 
            font-size: 16px; 
            border: 1px solid #ccc; 
            border-radius: 20px; 
            outline: none;
        }
        #btn { 
            padding: 10px 20px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 20px; 
            margin-left: 10px; 
            cursor: pointer; 
            font-size: 16px;
        }
        #btn:hover { background: #0056b3; }
        
        /* Модальное окно для просмотра изображения */
        #image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        #image-modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>💬 Войдите в чат</h1>
        <form id="login-form">
            <input id="username" placeholder="Ваше имя" autocomplete="off" required />
            <input id="password" type="password" placeholder="Пароль" autocomplete="off" required />
            <button type="submit">Войти</button>
            <div id="login-error"></div>
        </form>
    </div>

    <div id="chat-screen">
        <div id="chat-layout">
            <div id="sidebar">
                <div id="sidebar-header">Онлайн</div>
                <div id="online-list"></div>
            </div>
            <div id="chat-main">
                <div id="chat-header">
                    <span>Чат — <span id="my-name"></span></span>
                    <div id="header-buttons">
                        <button id="sound-btn" class="header-btn" title="Звук">🔔 Звук</button>
                        <button id="logout-btn" class="header-btn">Выйти</button>
                    </div>
                </div>
                <div id="upload-progress">Загрузка файла...</div>
                <ul id="messages"></ul>
                <form id="form" action="">
                    <button type="button" id="attach-btn" title="Прикрепить файл">📎</button>
                    <input type="file" id="file-input" />
                    <div id="recipient-label">Всем</div>
                    <input id="input" autocomplete="off" placeholder="Введите сообщение..." />
                    <button id="btn">Отправить</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Модальное окно для просмотра изображений -->
    <div id="image-modal">
        <img id="modal-image" src="" />
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const loginForm = document.getElementById('login-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginError = document.getElementById('login-error');
        const myNameLabel = document.getElementById('my-name');
        const logoutBtn = document.getElementById('logout-btn');
        const soundBtn = document.getElementById('sound-btn');
        const onlineList = document.getElementById('online-list');
        const recipientLabel = document.getElementById('recipient-label');
        const attachBtn = document.getElementById('attach-btn');
        const fileInput = document.getElementById('file-input');
        const uploadProgress = document.getElementById('upload-progress');
        const imageModal = document.getElementById('image-modal');
        const modalImage = document.getElementById('modal-image');

        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');

        let myName = '';
        let myPassword = '';
        let unreadCount = 0;
        let isTabActive = true;
        const originalTitle = 'Чат с файлами';
        let selectedRecipient = null;

        // Звук
        let audioContext = null;
        let soundEnabled = localStorage.getItem('soundEnabled') !== 'false';

        function initAudio() {
            if (!audioContext) {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.warn('Web Audio API не поддерживается');
                }
            }
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        function playSound() {
            if (!soundEnabled || !audioContext) return;
            try {
                const now = audioContext.currentTime;
                const oscillator = audioContext.createOscillator();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, now);
                const gainNode = audioContext.createGain();
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.start(now);
                oscillator.stop(now + 0.3);
            } catch (e) {
                console.warn('Ошибка звука:', e);
            }
        }

        function updateSoundButton() {
            if (soundEnabled) {
                soundBtn.textContent = '🔔 Звук';
                soundBtn.classList.remove('off');
            } else {
                soundBtn.textContent = '🔕 Звук';
                soundBtn.classList.add('off');
            }
        }

        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }

        function showNotification(title, body) {
            if ('Notification' in window && Notification.permission === 'granted') {
                const notification = new Notification(title, {
                    body: body,
                    tag: 'chat-message'
                });
                notification.onclick = function() {
                    window.focus();
                    notification.close();
                };
            }
        }

        function updateTitle() {
            if (unreadCount > 0) {
                document.title = `(${unreadCount}) ${originalTitle}`;
            } else {
                document.title = originalTitle;
            }
        }

        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                isTabActive = false;
            } else {
                isTabActive = true;
                unreadCount = 0;
                updateTitle();
            }
        });

        // Форматирование размера файла
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' Б';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' КБ';
            return (bytes / (1024 * 1024)).toFixed(1) + ' МБ';
        }

        // Загрузка файла на сервер
        function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            
            uploadProgress.style.display = 'block';
            uploadProgress.textContent = 'Загрузка файла...';
            
            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                uploadProgress.style.display = 'none';
                
                if (data.success) {
                    // Отправляем сообщение с файлом
                    const fileData = {
                        type: 'file',
                        text: '',
                        file: {
                            url: data.url,
                            name: data.originalname,
                            size: data.size,
                            isImage: data.isImage
                        }
                    };
                    
                    if (selectedRecipient) {
                        socket.emit('private message', {
                            to: selectedRecipient,
                            ...fileData
                        });
                    } else {
                        socket.emit('chat message', fileData);
                    }
                } else {
                    alert('Ошибка загрузки: ' + data.error);
                }
            })
            .catch(err => {
                uploadProgress.style.display = 'none';
                alert('Ошибка загрузки файла');
                console.error(err);
            });
        }

        // Список онлайн-пользователей
        socket.on('online users', function(usernames) {
            onlineList.innerHTML = '';
            usernames.forEach(function(name) {
                if (name !== myName) {
                    const div = document.createElement('div');
                    div.className = 'online-user';
                    div.textContent = name;
                    div.onclick = function() {
                        if (selectedRecipient === name) {
                            selectedRecipient = null;
                            recipientLabel.textContent = 'Всем';
                            div.classList.remove('selected');
                        } else {
                            const prev = onlineList.querySelector('.selected');
                            if (prev) prev.classList.remove('selected');
                            
                            selectedRecipient = name;
                            recipientLabel.textContent = `→ ${name}`;
                            div.classList.add('selected');
                        }
                    };
                    onlineList.appendChild(div);
                }
            });
        });

        // Автоматический вход
        const savedName = localStorage.getItem('username');
        const savedPassword = localStorage.getItem('password');
        if (savedName && savedPassword) {
            usernameInput.value = savedName;
            passwordInput.value = savedPassword;
            loginForm.dispatchEvent(new Event('submit'));
        }

        updateSoundButton();

        // Вход
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const name = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            
            if (!name || !password) {
                loginError.textContent = 'Заполните все поля';
                loginError.style.display = 'block';
                return;
            }
            
            socket.emit('user login', { username: name, password: password }, function(response) {
                if (response.success) {
                    myName = name;
                    myPassword = password;
                    localStorage.setItem('username', myName);
                    localStorage.setItem('password', myPassword);
                    
                    myNameLabel.textContent = myName;
                    loginScreen.style.display = 'none';
                    chatScreen.style.display = 'block';
                    loginError.style.display = 'none';
                    
                    input.focus();
                    requestNotificationPermission();
                    initAudio();
                } else {
                    loginError.textContent = response.error;
                    loginError.style.display = 'block';
                }
            });
        });

        // Выход
        logoutBtn.addEventListener('click', function() {
            localStorage.removeItem('username');
            localStorage.removeItem('password');
            messages.innerHTML = '';
            chatScreen.style.display = 'none';
            loginScreen.style.display = 'flex';
            usernameInput.value = '';
            passwordInput.value = '';
            usernameInput.focus();
            unreadCount = 0;
            updateTitle();
            selectedRecipient = null;
            recipientLabel.textContent = 'Всем';
        });

        // Звук
        soundBtn.addEventListener('click', function() {
            soundEnabled = !soundEnabled;
            localStorage.setItem('soundEnabled', soundEnabled);
            updateSoundButton();
            if (soundEnabled) {
                initAudio();
                playSound();
            }
        });

        // Кнопка прикрепления файла
        attachBtn.addEventListener('click', function() {
            fileInput.click();
        });

        // Выбор файла
        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                
                // Проверка размера (5 МБ)
                if (file.size > 5 * 1024 * 1024) {
                    alert('Файл слишком большой. Максимум 5 МБ.');
                    fileInput.value = '';
                    return;
                }
                
                uploadFile(file);
                fileInput.value = '';
            }
        });

        // Отправка текстового сообщения
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (input.value.trim()) {
                if (selectedRecipient) {
                    socket.emit('private message', {
                        to: selectedRecipient,
                        text: input.value
                    });
                } else {
                    socket.emit('chat message', {
                        text: input.value
                    });
                }
                input.value = '';
            }
        });

        // Ошибка
        socket.on('error message', function(error) {
            alert(error);
        });

        // Загрузка истории
        socket.on('load history', function(history) {
            history.forEach(function(data) {
                addMessage(data, false);
            });
            window.scrollTo(0, document.body.scrollHeight);
        });

        // Новое сообщение
        socket.on('chat message', function(data) {
            addMessage(data, true);
            window.scrollTo(0, document.body.scrollHeight);
        });

        // Добавление сообщения
        function addMessage(data, notify) {
            const item = document.createElement('li');
            
            if (data.type === 'system') {
                item.classList.add('system');
                item.textContent = data.text;
            } else {
                if (data.isPrivate) {
                    item.classList.add('private');
                }
                
                if (data.user === myName || data.isMine) {
                    item.classList.add('mine');
                }
                
                let prefix = '';
                if (data.isPrivate) {
                    prefix = data.isMine ? `[ЛС → ${data.to}] ` : `[ЛС от ${data.user}] `;
                }
                
                let content = `<div class="name">${prefix}${data.user}</div>`;
                
                if (data.text) {
                    content += `<div>${data.text}</div>`;
                }
                
                // Если есть файл
                if (data.file) {
                    content += '<div class="file-preview">';
                    if (data.file.isImage) {
                        content += `<img src="${data.file.url}" alt="${data.file.name}" onclick="openImageModal('${data.file.url}')" />`;
                    } else {
                        content += `<a href="${data.file.url}" target="_blank" class="file-link">
                            <span class="icon">📄</span>
                            <span class="info">
                                <span class="filename">${data.file.name}</span>
                                <span class="filesize">${formatFileSize(data.file.size)}</span>
                            </span>
                        </a>`;
                    }
                    content += '</div>';
                }
                
                item.innerHTML = content;
                
                if (notify && data.user !== myName && !data.isMine) {
                    playSound();
                    if (!isTabActive) {
                        unreadCount++;
                        updateTitle();
                        const title = data.isPrivate ? `ЛС от ${data.user}` : `${data.user} пишет:`;
                        const body = data.file ? (data.file.isImage ? '[Изображение]' : `[Файл: ${data.file.name}]`) : data.text;
                        showNotification(title, body);
                    }
                }
            }
            
            messages.appendChild(item);
        }

        // Модальное окно для изображений
        function openImageModal(url) {
            modalImage.src = url;
            imageModal.style.display = 'flex';
        }

        imageModal.addEventListener('click', function() {
            imageModal.style.display = 'none';
        });
    </script>
</body>
</html>
